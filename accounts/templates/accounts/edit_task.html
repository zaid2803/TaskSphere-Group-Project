<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2>Edit Task</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Task Title</label>
                <input
                    type="text"
                    name="title"
                    class="form-control"
                    value="{{ task.title }}"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea
                    name="description"
                    class="form-control"
                    rows="3">{{ task.description }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>

                <select name="status" class="form-control">

    <option value="Pending"
    {% if task.status == "Pending" %}selected{% endif %}>
    Pending
    </option>

    <option value="In Progress"
    {% if task.status == "In Progress" %}selected{% endif %}>
    In Progress
    </option>

    <option value="Completed"
    {% if task.status == "Completed" %}selected{% endif %}>
    Completed
    </option>

</select>
            </div>

            <div class="mb-3">
                <label class="form-label">Priority</label>

                <select name="priority" class="form-control">

                    <option value="High"
                    {% if task.priority == "High" %}selected{% endif %}>
                    High
                    </option>

                    <option value="Medium"
                    {% if task.priority == "Medium" %}selected{% endif %}>
                    Medium
                    </option>

                    <option value="Low"
                    {% if task.priority == "Low" %}selected{% endif %}>
                    Low
                    </option>

                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Due Date</label>

                <input
                    type="date"
                    name="due_date"
                    class="form-control"
                    value="{{ task.due_date|date:'Y-m-d' }}">
            </div>

            <button type="submit" class="btn btn-success">
                Update Task
            </button>

            <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
